# Builds the container image for linux/amd64 and linux/arm64 and publishes it as ONE
# multi-arch tag on ghcr.io, signed with cosign (keyless).
#
# NATIVE builds, no QEMU: each architecture builds on its own runner (ubuntu-24.04 and
# ubuntu-24.04-arm; the arm64 runners are free for public repositories). Each runner
# pushes its image BY DIGEST only -- no tag -- and a final job stitches the two digests
# into one manifest list carrying the version tag and `latest`. Emulated arm64 builds of
# onnxruntime/numpy take long and fail in ways a native build does not.
#
# Every action is pinned by full commit SHA (a tag can be moved; a SHA cannot), with the
# version in a comment for humans and Dependabot.
name: build-docker

on:
  push:
    tags: ['v*']

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/tursithepanda/ailurus-memory

jobs:
  # The tag is a promise about the code: v1.2.0 must be the commit whose version.py says
  # 1.2.0. Otherwise the image would announce one version and contain another.
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          v="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ai_memory/core/version.py)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$v" ] || [ "$v" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version.py ($v)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The whole test suite, inside the image's own environment and on this
      # architecture, BEFORE anything is pushed. Same layers as the image (cached).
      - name: Test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # SBOM and SLSA provenance are attached to the image as attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.arch }}

      # The pushed image, pulled back and asked the three things that matter: does it
      # import, is the model there, does the console script run.
      - name: Smoke-test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE@$DIGEST" python -c \
            "from ai_memory.server import server; from ai_memory.web import webapp; from ai_memory.features import embed; assert embed.is_ready(), 'model missing'"
          docker run --rm "$IMAGE@$DIGEST" ai-memory --version

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write     # the OIDC token cosign signs with -- no key to manage
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 digests: ${sources[*]}"; exit 1; }
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Resolve the manifest list digest
        id: digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          d="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$d" in sha256:*) ;; *) echo "::error::no digest ($d)"; exit 1;; esac
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # KEYLESS: the certificate binds the signature to this repository and this workflow
      # file at this tag (see docs/install/docker.md for `cosign verify`). The digest is
      # signed, not the tag, so the signature cannot be moved to other content.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
